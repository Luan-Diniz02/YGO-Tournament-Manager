{% extends "base.html" %}

{% block title %}Entrar - Liga YGO Marabá{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-header bg-dark text-white text-center py-3">
                <div class="d-inline-flex align-items-center justify-content-center p-2 rounded-circle bg-primary-subtle text-primary mb-2" style="width: 48px; height: 48px;">
                    <i class="fas fa-shield-halved fs-4"></i>
                </div>
                <h5 class="mb-0 fw-bold">Painel Administrativo</h5>
                <small class="text-muted">Acesso restrito para organizadores</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold">
                            <i class="fas fa-sign-in-alt me-1"></i> Acessar Painel
                        </button>
                        <a href="{{ url_for('public.index') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Voltar ao Início
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
